# Joule's scenario matcher is the routing layer. It compares the user's
# utterance against this description to decide whether to trigger the function
# below, so the description is written for a matcher, not for a person: it
# states plainly what is in scope and what is not.
description: >-
  The Team Analytics Agent answers a people manager's READ-ONLY questions about
  how their own team is participating in employee recognition. Use it for each
  team member's engagement index, who has given or received the most
  recognitions, who is not participating, how engagement changed over a period
  such as last quarter, rankings of team members, breakdowns by award reason or
  by monetary versus non-monetary program type, who recognised whom,
  sender-receiver pairs, and month-over-month changes. Use it as well for one
  person's individual recognitions - the message text, the award and the award
  reason: what someone was praised for, which skills or themes their messages
  mention, who recognised them most, and their most recent recognitions. Use it
  only for analysing, comparing, ranking or reporting on existing data. DO NOT
  use it when the user wants to send, draft, schedule or nominate a
  recognition, or change any data - those are write actions for a different
  agent.

target:
  name: analytics_function
  type: function
