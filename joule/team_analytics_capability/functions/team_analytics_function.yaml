# STAGE 4c - what Joule does with the agent's answer.
#
# The agent returns two artifacts over A2A:
#   artifacts[0] -> "response", the markdown narration. Always present.
#   artifacts[1] -> "ui", a DataPart holding the contract from src/ui_contract.py:
#                   {version, render, fields, items, actions, chart?, manifest?}
#                   Present only when the synth node produced a widget.
#
# The narration is always shown. Everything after that is additive, so if the
# structured part is missing or malformed the user still gets a complete answer.
#
# Why the two paths below look different:
#
#   card / list / choice / form -> `data.manifest` passthrough. The gateway
#       already baked a ui5integrationCard in Python (build_joule_manifest), so
#       there is nothing to template here. This is the preferred route.
#
#   chart -> built inline, because a chart needs its rows reshaped and that
#       reshaping is the one thing the manifest builder cannot pre-bake for
#       every chart type.
#
# TENANT-VERIFY - confirm both on the target tenant before the session:
#   1. That `data.manifest` can be passed straight through as an object. If the
#      tenant's SpEL will only emit strings, have the gateway serialise the
#      manifest to a JSON string and quote the expression here.
#   2. That this tenant renders ui5integrationCard for both "AdaptiveCard" and
#      "Analytical" card types.

action_groups:
  # 1 - Invoke the agent over A2A. The alias resolves to the BTP destination
  #     pointing at the gateway's /team-analytics-agent endpoint.
  - actions:
      - type: agent-request
        system_alias: TEAM_ANALYTICS_AGENT
        agent_type: remote
        result_variable: "apiResponse"

  # 2 - Always show the narration.
  - actions:
      - type: message
        message:
          type: markdown
          markdown: true
          content: "<? apiResponse.body.artifacts[0].parts[0].text ?>"

  # 3 - Pre-baked card types: one passthrough covers card, list, choice, form.
  - condition: apiResponse.body.artifacts.size() > 1 && apiResponse.body.artifacts[1].parts[0].data.manifest != null
    actions:
      - type: message
        scripting_type: spel
        message: <? apiResponse.body.artifacts[1].parts[0].data.manifest ?>

  # 4 - Outcome line.
  - condition: apiResponse.body.artifacts.size() > 1 && apiResponse.body.artifacts[1].parts[0].data.render == 'status'
    actions:
      - type: message
        message:
          type: card
          content:
            title: "<? apiResponse.body.artifacts[1].parts[0].data.fields.title ?>"
            subtitle: "<? apiResponse.body.artifacts[1].parts[0].data.fields.subtitle ?>"

  # 5 - The chart. This is the worked example's payoff.
  #
  # The contract carries chart data in WIDE form - one row per category, with a
  # column per measure:
  #     data: [{name: "Ana", engagement_index: 62}, {name: "Ben", ...}]
  #
  # A UI5 Analytical card wants LONG form - one row per (category, series) pair -
  # so that a single static binding can drive any number of series:
  #     [{label: "Ana", series: "engagement_index", value: 62}, ...]
  #
  # Unpivoting here rather than in the agent keeps the contract client-neutral:
  # a web app consuming the same DataPart wants the wide form. The nested
  # eachJoin below is the unpivot, and it means the manifest that follows uses
  # only fixed bindings ({label}/{series}/{value}) - never a dynamic key.
  - condition: apiResponse.body.artifacts.size() > 1 && apiResponse.body.artifacts[1].parts[0].data.render == 'chart'
    actions:
      - type: set-variables
        variables:
          - name: chart
            value: <? apiResponse.body.artifacts[1].parts[0].data.chart ?>
          - name: dimKey
            value: <? apiResponse.body.artifacts[1].parts[0].data.chart.dimensions[0] ?>

      - type: set-variables
        scripting_type: handlebars
        variables:
          - name: chartRows
            value: >
              [
                {{#eachJoin chart.data}}{{#eachJoin ../chart.measures}}{ "label": "{{lookup .. ../../dimKey}}", "series": "{{this}}", "value": {{lookup .. this}} }{{/eachJoin}}{{/eachJoin}}
              ]

      - type: message
        scripting_type: spel
        message: >
          {
            "type": "ui5integrationCard",
            "content": {
              "_version": "1.17.0",
              "sap.app": { "type": "card", "id": "workshop.team_analytics.chart" },
              "sap.card": {
                "type": "Analytical",
                "header": { "title": "<? chart.title ?>" },
                "content": {
                  "chartType": "<? chart.chart_type ?>",
                  "data": { "json": <? chartRows ?> },
                  "dimensions": [
                    { "label": "<? dimKey ?>", "value": "{label}" },
                    { "label": "Series", "value": "{series}" }
                  ],
                  "measures": [ { "label": "Value", "value": "{value}" } ],
                  "feeds": [
                    { "uid": "categoryAxis", "type": "Dimension", "values": [ "<? dimKey ?>" ] },
                    { "uid": "color", "type": "Dimension", "values": [ "Series" ] },
                    { "uid": "valueAxis", "type": "Measure", "values": [ "Value" ] }
                  ]
                }
              }
            }
          }
